name: ez_menu
description: EZ Menu - Digital Menu and Restaurant Ordering Platform (EZ Ecosystem). One Flutter codebase for the Android, iOS and Web dashboard plus the customer QR menu.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.9.0

  # State and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Device and files
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  file_saver: ^0.2.14
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # QR and print
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  printing: ^5.14.2

  # Utilities
  http: ^1.2.2
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
