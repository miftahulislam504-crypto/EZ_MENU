<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="EZ Menu - digital menu and restaurant ordering platform.">
  <meta name="theme-color" content="#166A4C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EZ Menu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>EZ Menu</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F4F6F2; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0F2A21;
    }
    #boot .mark { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    #boot .mark span { color: #166A4C; }
    #boot .bar { width: 120px; height: 3px; border-radius: 3px; background: #E0E6DE; overflow: hidden; }
    #boot .bar i { display: block; width: 40%; height: 100%; background: #F0A81C; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <div class="mark">EZ <span>Menu</span></div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
